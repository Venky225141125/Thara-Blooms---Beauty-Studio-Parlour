<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 220" width="100%" height="100%" fill="none">
  <defs>
    <!-- Soft Blush Wash for Dark Background -->
    <radialGradient id="lldBlush" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#FFF5F7" />
      <stop offset="65%" stopColor="#FCE7EC" />
      <stop offset="100%" stopColor="#F8D8DF" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="lldGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#E6CE8A" />
      <stop offset="25%" stopColor="#FFF2C6" />
      <stop offset="55%" stopColor="#D8B55C" />
      <stop offset="85%" stopColor="#F5E4AA" />
      <stop offset="100%" stopColor="#C9A44C" />
    </linearGradient>

    <!-- Floral Petals -->
    <linearGradient id="lldPetalPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFDEE6" />
      <stop offset="45%" stopColor="#F49EB0" />
      <stop offset="100%" stopColor="#D96983" />
    </linearGradient>
    <linearGradient id="lldPetalDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F6A7B8" />
      <stop offset="100%" stopColor="#BD435E" />
    </linearGradient>

    <!-- Botanical Green Foliage -->
    <linearGradient id="lldGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#6C8F6F" />
      <stop offset="60%" stopColor="#43684B" />
      <stop offset="100%" stopColor="#2A4531" />
    </linearGradient>

    <filter id="lldShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" floodColor="#000000" floodOpacity="0.3" />
    </filter>
  </defs>

  <!-- === LEFT: CIRCULAR EMBLEM CREST === -->
  <g transform="translate(10, 10)">
    <g transform="scale(0.6667)">
      <!-- Blush Wash Circle -->
      <circle cx="150" cy="150" r="132" fill="url(#lldBlush)" />
      <!-- Metallic Gold Rings -->
      <circle cx="150" cy="150" r="126" stroke="url(#lldGold)" stroke-width="2.5" />
      <circle cx="150" cy="150" r="118" stroke="url(#lldGold)" stroke-width="1.2" opacity="0.8" />

      <!-- Top-Left Floral Bouquet -->
      <g filter="url(#lldShadow)">
        <path d="M72 105 C66 90 72 69 90 57 C102 48 120 45 132 45" stroke="url(#lldGreen)" stroke-width="1.8" fill="none" opacity="0.85" />
        <path d="M60 117 C50 111 48 99 54 90 C62 96 66 108 60 117 Z" fill="url(#lldGreen)" />
        <path d="M48 93 C39 87 39 75 47 67 C53 75 56 87 48 93 Z" fill="url(#lldGreen)" />
        <path d="M66 75 C60 63 66 51 75 48 C77 57 74 69 66 75 Z" fill="url(#lldGreen)" />
        <path d="M93 54 C96 40 108 36 117 39 C114 48 105 54 93 54 Z" fill="url(#lldGreen)" />
        <path d="M117 42 C123 30 135 30 141 35 C137 42 129 45 117 42 Z" fill="url(#lldGreen)" />
        <ellipse cx="96" cy="38" rx="5" ry="6.5" fill="url(#lldPetalPink)" />
        <ellipse cx="78" cy="48" rx="6" ry="7.5" fill="url(#lldPetalDeep)" />

        <g transform="translate(108, 60)">
          <path d="M0 -15 C6 -24 20 -20 18 -8 C15 2 0 10 -4 10 C-8 10 -15 2 -12 -8 C-10 -20 4 -24 0 -15 Z" fill="url(#lldPetalPink)" />
          <circle cx="0" cy="-2" r="3.5" fill="#FFE27A" />
        </g>
        <g transform="translate(75, 84)">
          <path d="M0 -14 C5 -22 18 -18 16 -7 C13 2 0 9 -3 9 C-7 9 -13 2 -10 -7 C-8 -18 3 -22 0 -14 Z" fill="url(#lldPetalDeep)" />
          <circle cx="0" cy="-2" r="3" fill="#FFE27A" />
        </g>
      </g>

      <!-- Bottom-Right Floral Bouquet -->
      <g filter="url(#lldShadow)">
        <path d="M228 195 C234 210 228 231 210 243 C198 252 180 255 168 255" stroke="url(#lldGreen)" stroke-width="1.8" fill="none" opacity="0.85" />
        <path d="M240 183 C250 189 252 201 246 210 C238 204 234 192 240 183 Z" fill="url(#lldGreen)" />
        <path d="M252 207 C261 213 261 225 253 233 C247 225 244 213 252 207 Z" fill="url(#lldGreen)" />
        <path d="M234 225 C240 237 234 249 225 252 C223 243 226 231 234 225 Z" fill="url(#lldGreen)" />
        <ellipse cx="204" cy="262" rx="5" ry="6.5" fill="url(#lldPetalPink)" />
        <ellipse cx="222" cy="252" rx="6" ry="7.5" fill="url(#lldPetalDeep)" />

        <g transform="translate(192, 240)">
          <path d="M0 15 C-6 24 -20 20 -18 8 C-15 -2 0 -10 4 -10 C8 -10 15 -2 12 8 C10 20 -4 24 0 15 Z" fill="url(#lldPetalPink)" />
          <circle cx="0" cy="2" r="3.5" fill="#FFE27A" />
        </g>
        <g transform="translate(225, 216)">
          <path d="M0 14 C-5 22 -18 18 -16 7 C-13 -2 0 -9 3 -9 C7 -9 13 -2 10 7 C8 18 -3 22 0 14 Z" fill="url(#lldPetalDeep)" />
          <circle cx="0" cy="2" r="3" fill="#FFE27A" />
        </g>
      </g>

      <!-- Center Woman Profile Silhouette -->
      <g fill="#110E10">
        <path d="M148 94 C152 90 156 89 160 91 C164 93 166 98 165 103 C164 107 160 110 156 111 C159 113 162 116 161 120 C160 124 156 126 153 126 C155 129 157 132 155 136 C153 139 148 141 144 140 C146 145 145 151 141 155 C137 159 132 161 128 161 C133 167 134 175 131 182 C127 189 119 193 112 192 C116 200 115 210 109 216 C103 222 93 223 85 220 C81 228 73 234 64 233 C54 232 46 224 46 214 C46 204 53 196 63 195 C64 186 70 178 78 175 C77 168 81 161 88 157 C89 149 95 143 103 141 C105 133 112 128 120 127 C122 120 128 115 135 114 C137 106 143 100 148 94 Z" />
        <path d="M165 103 C168 104 172 107 174 110 C175 113 173 116 170 117 C174 119 176 123 175 127 C174 130 170 132 166 132 C169 135 170 139 168 143 C166 146 161 148 157 147" fill="none" stroke="#110E10" stroke-width="2" stroke-linecap="round" />
      </g>

      <!-- Interlocking Monogram TB in Gold -->
      <g fill="url(#lldGold)" filter="url(#lldShadow)">
        <path d="M124 112 L182 112 L182 122 L158 122 L158 184 L144 184 L144 122 L124 122 Z" opacity="0.95" />
        <path d="M148 126 L178 126 C188 126 196 132 196 141 C196 147 192 152 186 154 C194 157 199 163 199 171 C199 181 190 188 178 188 L148 188 Z M162 136 L162 151 L176 151 C181 151 185 147 185 143 C185 139 181 136 176 136 Z M162 161 L162 178 L178 178 C183 178 187 174 187 169 C187 165 183 161 178 161 Z" opacity="0.95" />
      </g>

      <!-- Butterfly on Crest -->
      <g transform="translate(196, 92) rotate(-15) scale(0.95)" fill="url(#lldGold)" filter="url(#lldShadow)">
        <path d="M0 0 C4 -10 14 -12 18 -7 C22 -2 18 8 10 10 C16 14 18 22 13 25 C8 28 2 24 0 16 Z" />
        <path d="M0 0 C-4 -10 -14 -12 -18 -7 C-22 -2 -18 8 -10 10 C-16 14 -18 22 -13 25 C-8 28 -2 24 0 16 Z" opacity="0.75" />
        <line x1="0" y1="-8" x2="0" y2="20" stroke="url(#lldGold)" stroke-width="1.5" />
      </g>
    </g>
  </g>

  <!-- === VERTICAL GOLD DIVIDER === -->
  <line x1="236" y1="36" x2="236" y2="184" stroke="url(#lldGold)" stroke-width="2.5" stroke-linecap="round" />

  <!-- === RIGHT: BRAND TYPOGRAPHY (PURE CRISP WHITE FOR DARK BACKGROUNDS) === -->
  <g transform="translate(262, 0)">
    <!-- Line 1: THARA BLOOMS (Pure White) -->
    <text x="0" y="84" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="52" font-weight="700" fill="#FFFFFF" letter-spacing="0.16em">
      THARA BLOOMS
    </text>

    <!-- Thin Divider under Title (Pure White, matching Title) -->
    <line x1="0" y1="104" x2="495" y2="104" stroke="#FFFFFF" stroke-width="2" />

    <!-- Line 2: BEAUTY STUDIO & PARLOUR (Pure White, matching Title) -->
    <text x="247" y="134" text-anchor="middle" font-family="'Montserrat', 'Cinzel', sans-serif" font-size="19" font-weight="600" fill="#FFFFFF" letter-spacing="0.44em">
      BEAUTY STUDIO &amp; PARLOUR
    </text>

    <!-- Line 3: — Glow with Grace ♥ — (Pure White) -->
    <g transform="translate(247, 180)">
      <!-- Left White Dash -->
      <line x1="-165" y1="-7" x2="-110" y2="-7" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />

      <!-- Script Text -->
      <text x="-95" y="0" font-family="'Alex Brush', 'Great Vibes', 'Cormorant Garamond', cursive" font-style="italic" font-size="34" font-weight="500" fill="#FFFFFF" letter-spacing="0.04em">
        Glow with Grace
      </text>

      <!-- Pink Heart Icon -->
      <path d="M96 -14 C92 -18 84 -17 81 -11 C78 -17 70 -18 66 -14 C60 -8 67 1 81 10 C95 1 102 -8 96 -14 Z" fill="#D98296" />

      <!-- Right White Dash -->
      <line x1="110" y1="-7" x2="165" y2="-7" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
    </g>
  </g>
</svg>
